<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; style-src 'self'; img-src 'self' data:">
  <title>Mini Player</title>
  <link rel="stylesheet" href="mini.css">
</head>
<body>
  <div class="card">
    <iframe id="yt" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <div class="loading" id="loading"><span class="spinner"></span></div>

    <div class="bar">
      <div class="grip">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4a2.5 2.5 0 0 0-1.8 1.8C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8ZM10 15V9l5.2 3z"/></svg>
        <span id="title" dir="auto">Mini Player</span>
      </div>
      <button id="back" title="Back to the tab (continues from here)" aria-label="Back to the tab">
        <svg class="s" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="m10 14 4-4M10 10h4v4"/></svg>
      </button>
      <button id="close" title="Close (the tab stays paused at this point)" aria-label="Close">
        <svg class="s" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="msg" id="msg" hidden>
      <b>This video can't play in the mini player</b>
      <span>Its owner only allows it on YouTube. Going back to the tab…</span>
    </div>

    <div class="rz rz-bl" data-corner="bl" title="Resize"></div>
    <div class="rz rz-br" data-corner="br" title="Resize"></div>
  </div>
  <script src="mini.js"></script>
</body>
</html>
