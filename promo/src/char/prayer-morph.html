<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <title>Prayer time: the island becomes Yovy</title>
  <style>
    @font-face { font-family: "Yovy Quran"; src: url("../../../fonts/Elgharib-KFGQPCHafsV3-Taweel.ttf") format("truetype"); }
    @font-face { font-family: "Plex Arabic"; font-weight: 600; src: url("../assets/plex-arabic-600.woff2") format("woff2"); }
    @font-face { font-family: "Plex Arabic"; font-weight: 400; src: url("../assets/plex-arabic-400.woff2") format("woff2"); }
    :root { --T: 7s; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 960px; height: 480px; overflow: hidden; font-family: "Plex Arabic", "Segoe UI", sans-serif; color: #fff;
      background: radial-gradient(40% 60% at 20% 30%, rgba(124, 58, 237, .45), transparent 70%),
                  radial-gradient(40% 60% at 80% 80%, rgba(16, 122, 98, .4), transparent 70%),
                  linear-gradient(160deg, #0f0c24, #0a1526 60%, #070b16); }
    /* the island's window: 640x320, shown at 1.5x */
    .win { position: absolute; left: 0; top: 0; width: 640px; height: 320px; transform: scale(1.5); transform-origin: 0 0; }
    .anim, .anim * { animation-duration: var(--T); animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.3, 1.2, .45, 1); }

    /* ---------- the island that becomes Yovy ---------- */
    .isl {
      position: absolute; left: 202px; top: 8px; width: 236px; height: 32px; border-radius: 16px;
      background: rgba(18, 18, 26, .9); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 8px 20px -8px rgba(0,0,0,.6);
      animation-name: isl;
    }
    @keyframes isl {
      0%, 8%   { left: 202px; top: 8px;  width: 236px; height: 32px; border-radius: 16px; }
      14%      { left: 190px; top: 11px; width: 260px; height: 26px; border-radius: 13px; } /* squeeze */
      19%      { left: 206px; top: 6px;  width: 228px; height: 36px; border-radius: 18px; }
      28%      { left: 508px; top: 44px; width: 64px;  height: 66px; border-radius: 28px; } /* becomes the body */
      86%      { left: 508px; top: 44px; width: 64px;  height: 66px; border-radius: 28px; }
      94%, 100% { left: 202px; top: 8px; width: 236px; height: 32px; border-radius: 16px; }
    }
    /* violet glass fading in over the dark pill */
    .isl .violet { position: absolute; inset: 0; border-radius: inherit; opacity: 0; animation-name: violet;
      background: radial-gradient(60% 50% at 32% 25%, rgba(255,255,255,.5), transparent 70%), linear-gradient(135deg, #8b7bff, #5b6cff 55%, #3b82f6); }
    @keyframes violet { 0%, 22% { opacity: 0; } 30%, 86% { opacity: 1; } 92%, 100% { opacity: 0; } }
    .isl .clock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; direction: ltr;
      font: 600 13px "Segoe UI"; animation-name: clock; }
    .isl .clock span { font-weight: 400; color: rgba(235,235,245,.7); font-size: 12px; }
    @keyframes clock { 0%, 9% { opacity: 1; } 13%, 94% { opacity: 0; } 98%, 100% { opacity: 1; } }

    /* face 1, always centred on the morphing shape */
    .face { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -19px 0 0 -15px; }
    .eye { position: absolute; top: 0; width: 10px; height: 14px; border-radius: 5px; background: #fff; transform-origin: 50% 50%; animation-name: eye; box-shadow: 0 0 8px rgba(255,255,255,.4); }
    .eye b { position: absolute; left: 3px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: #0b0b12; }
    .eye.l { left: 0; } .eye.r { right: 0; }
    @keyframes eye {
      0%, 16% { transform: scaleY(0); }
      21%     { transform: scaleY(1.15); }
      23%     { transform: scaleY(.9); }
      25%, 59% { transform: scaleY(1); }
      60.5%   { transform: scaleY(.1); } /* blink */
      62%, 88% { transform: scaleY(1); }
      92%, 100% { transform: scaleY(0); }
    }
    .smile { position: absolute; left: 50%; top: 18px; width: 12px; height: 6px; margin-left: -6px; border: 2.2px solid #0b0b12; border-top: 0; border-radius: 0 0 8px 8px; opacity: 0; animation-name: soft; }
    .cheek { position: absolute; top: 13px; width: 7px; height: 7px; border-radius: 50%; background: #ff8fb8; opacity: 0; animation-name: soft; }
    .cheek.l { left: -9px; } .cheek.r { right: -9px; }
    @keyframes soft { 0%, 29% { opacity: 0; } 33%, 86% { opacity: .75; } 90%, 100% { opacity: 0; } }

    /* limbs slide out from under the body */
    .limbs { position: absolute; left: 50%; top: 0; width: 1px; height: 1px; opacity: 0; animation-name: limbs; }
    @keyframes limbs { 0%, 30% { opacity: 0; transform: translateY(-14px) scaleY(.4); } 36%, 84% { opacity: 1; transform: none; } 88%, 100% { opacity: 0; transform: translateY(-14px) scaleY(.4); } }
    .limbs svg { position: absolute; left: -60px; top: 0; overflow: visible; }

    /* the white prayer cap settles on the head */
    .cap { position: absolute; left: 50%; top: -15px; width: 54px; height: 22px; margin-left: -27px; opacity: 0; animation-name: cap; }
    .cap::before { content: ""; position: absolute; inset: 0 0 4px; border-radius: 27px 27px 4px 4px; background: #fafafa;
      background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 6px); }
    .cap::after { content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 4px; border-radius: 2px; background: #dcdce6; }
    @keyframes cap { 0%, 38% { opacity: 0; transform: translateY(-30px); } 44% { opacity: 1; transform: translateY(3px); } 47%, 84% { opacity: 1; transform: none; } 88%, 100% { opacity: 0; transform: translateY(-20px); } }

    /* ---------- the prayer rug unrolls under her feet ---------- */
    .rug { position: absolute; left: 480px; top: 150px; width: 120px; height: 26px; transform-origin: 50% 50%; opacity: 0; animation-name: rug; }
    .rug svg { overflow: visible; }
    @keyframes rug { 0%, 30% { opacity: 0; transform: scaleX(0); } 38%, 84% { opacity: 1; transform: none; } 90%, 100% { opacity: 0; transform: scaleX(0); } }

    /* ---------- the call card ---------- */
    .card {
      position: absolute; left: 36px; top: 34px; width: 440px; height: 146px; border-radius: 30px; direction: rtl;
      background: rgba(14, 14, 22, .92); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 24px 60px -14px rgba(0,0,0,.7);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; opacity: 0; animation-name: card;
      overflow: hidden;
    }
    .card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(80% 90% at 100% 0%, rgba(255, 212, 121, .22), transparent 60%); }
    @keyframes card { 0%, 46% { opacity: 0; transform: translateX(18px) scale(.94); filter: blur(4px); } 54%, 84% { opacity: 1; transform: none; filter: none; } 90%, 100% { opacity: 0; transform: translateX(18px) scale(.94); filter: blur(4px); } }
    .badge { position: absolute; top: 12px; right: 18px; height: 22px; padding: 0 10px; border-radius: 99px; display: flex; align-items: center; gap: 5px;
      background: rgba(255, 212, 121, .16); color: #ffd479; font-size: 12px; font-weight: 600; }
    .t { position: relative; font-family: "Yovy Quran", serif; font-size: 36px; line-height: 1.25; text-shadow: 0 0 18px rgba(255, 212, 121, .45); }
    .s { position: relative; font-size: 15px; color: rgba(235,235,245,.75); }
    .s b { color: #ffd479; }
    .time { display: inline-block; margin-inline-start: 6px; padding: 0 9px; border-radius: 99px; background: rgba(255, 212, 121, .16); color: #ffd479; font: 700 13px "Segoe UI"; direction: ltr; unicode-bidi: isolate; }
    .bar { position: absolute; left: 30px; right: 30px; bottom: 10px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
    .bar b { display: block; height: 100%; background: #ffd479; box-shadow: 0 0 6px #ffd479; animation-name: bar; animation-timing-function: linear; }
    @keyframes bar { 0%, 54% { width: 100%; } 84%, 100% { width: 8%; } }

    /* warm light from the call */
    .glow { position: absolute; left: 330px; top: -80px; width: 420px; height: 300px; border-radius: 50%; opacity: 0; animation-name: glow;
      background: radial-gradient(closest-side, rgba(255, 212, 121, .28), transparent); }
    @keyframes glow { 0%, 10% { opacity: 0; } 20%, 84% { opacity: 1; } 92%, 100% { opacity: 0; } }

    /* a soft breath while she waits */
    .breath { position: absolute; inset: 0; animation-name: breath; }
    @keyframes breath { 0%, 50% { transform: none; } 64% { transform: translateY(-1.5px); } 78% { transform: none; } 100% { transform: none; } }

    .caption { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 17px; color: rgba(255,255,255,.55); direction: rtl; }
  </style>
</head>
<body>
  <div class="win anim">
    <div class="glow"></div>

    <div class="rug">
      <svg width="120" height="26" viewBox="0 0 120 26">
        <path d="M6 26 L114 26 L100 0 L20 0 Z" fill="#8e1a36"/>
        <path d="M14 22 L106 22 L95 4 L25 4 Z" fill="none" stroke="#e8b85c" stroke-width="1.5"/>
        <path d="M46 4 Q60 -8 74 4" fill="none" stroke="#e8b85c" stroke-width="1.5"/>
        <path d="M8 26 l-2 4 M20 26 l-1 4 M32 26 v4 M44 26 v4 M56 26 v4 M68 26 v4 M80 26 v4 M92 26 l1 4 M104 26 l2 4" stroke="#e8b85c" stroke-width="1.2"/>
      </svg>
    </div>

    <div class="card">
      <span class="badge">☾ الأذان</span>
      <span class="t">أَقِمْ صَلَاتَكَ</span>
      <span class="s">حان الآن وقت صلاة <b>العصر</b><span class="time">3:49 PM</span></span>
      <span class="bar"><b></b></span>
    </div>

    <div class="isl">
      <div class="violet"></div>
      <div class="clock">10:24 AM <span>Thu, Oct 29</span></div>
      <div class="limbs">
        <svg width="120" height="120" viewBox="-60 0 120 120">
          <!-- legs and feet down to the rug -->
          <path d="M-10 60 L-12 90 M10 60 L12 90" stroke="#4c5dff" stroke-width="6" stroke-linecap="round"/>
          <ellipse cx="-14" cy="94" rx="9" ry="5" fill="#4c5dff"/><ellipse cx="14" cy="94" rx="9" ry="5" fill="#4c5dff"/>
          <!-- hands folded on the chest -->
          <path d="M-30 40 Q-22 52 -6 50 M30 40 Q22 52 6 50" fill="none" stroke="#6c7bff" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="breath">
        <div class="face">
          <i class="eye l"><b></b></i><i class="eye r"><b></b></i>
          <i class="cheek l"></i><i class="cheek r"></i>
          <i class="smile"></i>
        </div>
        <div class="cap"></div>
      </div>
    </div>
  </div>
  <div class="caption">عند الأذان: تتحوّل الجزيرة إلى نوفا بطاقية الصلاة على السجادة — ثم تعود جزيرة</div>

  <script>
    // ?t=<ms>: freeze every animation at that moment (used to export the frames)
    const t = new URLSearchParams(location.search).get('t');
    if (t !== null) {
      document.fonts.ready.then(() => {
        for (const a of document.getAnimations()) { a.pause(); a.currentTime = Number(t); }
        document.documentElement.dataset.ready = '1';
      });
    }
  </script>
</body>
</html>
